[project]
name = "dmean-worker"
version = "0.1.0"
description = "Leases tasks from the orchestrator over gRPC and sums their input files into one output"
requires-python = ">=3.13"
dependencies = [
  "boto3==1.43.114",
  "grpcio==1.84.0",
  "numpy==2.5.4",
  "protobuf==7.36.2",
  "pydantic-settings==2.16.0",
  "structlog==26.1.0",
]

[project.scripts]
dmean-worker = "dmean_worker.main:main"

[dependency-groups]
dev = ["grpcio-tools==1.84.0", "pytest==9.1.1", "ruff==0.17.1", "pyright==1.1.414"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmean_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/dmean_worker/rpc/*_pb2*.py*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# allow × and → in comments and docstrings
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
exclude = ["**/*_pb2*", ".venv"]
# boto3 and grpc ship partial stubs; don't fail on their internals
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs docker compose (minio)"]
