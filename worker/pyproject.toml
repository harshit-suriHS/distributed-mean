[project]
name = "dmean-worker"
version = "0.1.0"
description = "Dramatiq worker: sums a task's input files into one partial (or the final result)"
requires-python = ">=3.13"
dependencies = [
  "boto3==1.43.114",
  "dramatiq[redis]==2.2.1",
  "numpy==2.5.4",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.0",
  "structlog==26.1.0",
]

[project.scripts]
dmean-worker = "dmean_worker.main:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "pyright==1.1.414"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmean_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# allow × and → in comments and docstrings
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# boto3 and dramatiq ship partial stubs; don't fail on their internals
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs docker compose (postgres, redis, minio)"]
