[project]
name = "dmean-e2e"
version = "0.1.0"
description = "End-to-end tests: API, orchestrator and workers as real processes"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "boto3==1.43.114",
  "numpy==2.5.4",
  "psycopg[binary]==3.3.6",
  "pytest==9.1.1",
  "requests==2.34.2",
  "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
