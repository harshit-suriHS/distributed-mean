name: distributed-mean

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates app login roles (passwords from .env). Idempotent.
  db-roles:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./db/roles.sql:/roles.sql:ro
    command: >
      psql -v ON_ERROR_STOP=1 -q
           -v api_pw=${API_DB_PASSWORD}
           -v orchestrator_pw=${ORCHESTRATOR_DB_PASSWORD}
           -v supervisor_pw=${SUPERVISOR_DB_PASSWORD}
           -f /roles.sql
    restart: "no"

  # One-shot: applies db/migrations, writes db/schema.sql
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db
    command: ["--wait", "up"]
    restart: "no"

  minio:
    # Community build; MinIO no longer publishes official images
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket, then exits
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
             mc mb --ignore-existing local/$$S3_BUCKET"
    restart: "no"

  # ---- application services (built from this repo) ----

  api:
    build: ./api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      S3_ENDPOINT: http://minio:9000
      # presigned URLs are used from the host machine
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT}
      ORCHESTRATOR_ADDR: orchestrator:50051  # live worker view (Admin gRPC)
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${GRPC_PORT}:50051"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # crash-only: on a fatal error it exits, Docker restarts it, it rebuilds from Postgres
    restart: always
    init: true  # PID 1 forwards signals (PID 1 itself ignores signals it has no handler for)

  # Scheduled storage cleanup: one sweep per CLEANUP_EVERY_SECS (hourly). Deletes a job's inputs and
  # partials CLEANUP_AFTER_HOURS (24) after it ends, and expires abandoned uploads. On Kubernetes:
  # a CronJob running the same command.
  cleanup:
    build: ./orchestrator
    command: ["sh", "-c", "while true; do /app/.venv/bin/dmean-cleanup; sleep $${CLEANUP_EVERY_SECS:-3600}; done"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      S3_ENDPOINT: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

  # No worker service: the supervisor starts and stops worker processes in its container to
  # match settings.desired_workers (PUT /workers changes it). On Kubernetes, a Deployment of
  # the worker image with replicas = W replaces the supervisor.
  supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      ORCHESTRATOR_ADDR: orchestrator:50051
      S3_ENDPOINT: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      orchestrator:
        condition: service_started
    # SIGTERM drains every worker (each finishes its current task); give them time
    stop_grace_period: 5m
    restart: always
    init: true

  ui:
    build: ./ui
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
