[project]
name = "dmean-worker"
version = "0.1.0"
description = "Dramatiq worker: sums a task's input files into one partial (or the final result)"
requires-python = ">=3.13"
dependencies = [
  "dmean-common",
  "psycopg[binary]==3.3.6",
]

[project.scripts]
dmean-worker = "dmean_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmean_worker"]
