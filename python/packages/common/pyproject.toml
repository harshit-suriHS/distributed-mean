[project]
name = "dmean-common"
version = "0.1.0"
description = "Shared by worker and orchestrator: config, message contracts, storage keys, CSV format"
requires-python = ">=3.13"
dependencies = [
  "boto3==1.43.114",
  "dramatiq[redis]==2.2.1",
  "numpy==2.5.4",
  "pydantic-settings==2.16.0",
  "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmean_common"]
